name: release
# Tag vX.Y.Z → static binaries for macOS (arm64, amd64) and Linux (amd64,
# arm64) attached to a GitHub release, plus checksums. install.sh fetches them.
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - name: build
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/work-$os-$arch" .
          done
          (cd dist && sha256sum work-* > checksums.txt)
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
